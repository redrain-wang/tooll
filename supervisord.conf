[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx_access.log
stderr_logfile=/var/log/nginx_error.log

[program:translate-server]
command=gunicorn --bind 0.0.0.0:3001 --workers 2 --timeout 30 translate:app
directory=/app/server_py
autostart=true
autorestart=true
stdout_logfile=/var/log/translate.log
stderr_logfile=/var/log/translate_error.log

[program:rsa-server]
command=gunicorn --bind 0.0.0.0:3002 --workers 2 --timeout 30 rsa_server:app
directory=/app/server_py
autostart=true
autorestart=true
stdout_logfile=/var/log/rsa.log
stderr_logfile=/var/log/rsa_error.log

[program:aes-server]
command=gunicorn --bind 0.0.0.0:3003 --workers 2 --timeout 30 aes_server:app
directory=/app/server_py
autostart=true
autorestart=true
stdout_logfile=/var/log/aes.log
stderr_logfile=/var/log/aes_error.log